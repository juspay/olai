<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover puts the page under the notch and the home bar,
         which is what makes `env(safe-area-inset-*)` report anything but zero
         — every fixed thing in this app pads itself by them.
         interactive-widget says what an on-screen keyboard should do: shrink
         the viewport, so a box fixed to the bottom stays above it. Where that
         is honoured it is the whole fix; where it is not (iOS), the page
         measures `visualViewport` itself (src/client/viewport.ts). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>olai</title>
    <meta name="description" content="outlines in flat-record JSONL" />
    <!-- INLINE-NESS IS LOAD-BEARING, and this is the only script in the shell.
         A theme picked in this browser has to be on <html> before the FIRST
         PAINT; everything else on this page is deferred, so a theme restored
         from the bundle would land after it, which is a flash of the wrong
         colours on every single load. So this much runs in <head>, and nothing
         else does — what happens after a chip is pressed is
         src/client/theme/.

         It deliberately knows no theme or font names: the sheet carries a
         block per palette and per typeface, and the tables that generate
         them live in one place each (src/client/theme/palettes.ts,
         src/client/theme/fonts.ts). A stored name no row offers is
         forgotten by the app once it is up, which is the first moment
         anything knows the lists. The keys are those tables'
         THEME_STORAGE_KEY / FONT_STORAGE_KEY and the attributes are
         THEME_ATTRIBUTE / FONT_ATTRIBUTE; theme/css.test.ts and
         theme/fontCss.test.ts hold this script to both.

         `setAttribute`, not `dataset.theme`: they are the same thing today,
         and the day a pref's name has a hyphen in it they are not. -->
    <script>
      try {
        var picked = localStorage.getItem("olai.theme");
        if (picked) document.documentElement.setAttribute("data-theme", picked);
        var face = localStorage.getItem("olai.font");
        if (face) document.documentElement.setAttribute("data-font", face);
      } catch {}
    </script>
    <!-- The browser chrome around an installed app: a phone's status bar, an
         installed window's title bar. ONE of them, holding the DEFAULT theme's
         paper — the palette a page that has picked nothing reads in — because
         that is the only one this shell can know before the bundle runs. A
         page that did pick repaints this from the table (theme/state.ts). The
         value is `--color-paper` of the default palette, which cannot be read
         from here (the sheet is a build artifact and this shell is what loads
         it) and is pinned by theme/css.test.ts instead. -->
    <meta name="theme-color" content="#FAFAF6" />
    <!-- What the browser should assume before the sheet lands: it cannot know
         yet which theme this page is in, and the themes come both ways. Once
         the sheet is in, each palette's own `color-scheme` is what wins. -->
    <meta name="color-scheme" content="light dark" />
    <!-- The install surface. The manifest is the SERVER's
         (packages/server/src/listener.ts, through kolu's manifest layer); the
         icons are files copied to the dist root by the build. `rel="icon"` is
         the tab, `apple-touch-icon` is iOS's Add to Home Screen, which reads
         no manifest — so the same mark has to be named twice. There is no
         service worker and no offline shell: this app is live or nothing. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="olai" />
    <!-- The markdown pipeline is NOT named here, and deliberately not preloaded
         either: an outline of rows must not fetch it at all, and a preload is a
         fetch. The page finds it by asking — a dynamic `import()` the bundler
         splits into its own hashed chunk (src/client/markdown/chunk.ts). -->
    <!-- The `href` below and the `<script src>` in the body are the two
         placeholders the build rewrites to hashed /assets/* URLs; they must
         match build.ts byte for byte. -->
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <!-- The page's own two utilities. Tailwind's preflight zeroes the body
       margin; the palette and the font are ours. -->
  <body class="bg-paper font-sans text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
