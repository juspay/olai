<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover puts the page under the notch and the home bar,
         which is what makes `env(safe-area-inset-*)` report anything but zero
         — every fixed thing in this app pads itself by them.
         interactive-widget says what an on-screen keyboard should do: shrink
         the viewport, so a box fixed to the bottom stays above it. Where that
         is honoured it is the whole fix; where it is not (iOS), the page
         measures `visualViewport` itself (src/client/viewport.ts). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>olai</title>
    <meta name="description" content="outlines in flat-record JSONL" />
    <!-- INLINE-NESS IS LOAD-BEARING, and this is the only script in the shell.
         A theme picked in this browser has to be on <html> before the FIRST
         PAINT; everything else on this page is deferred, so a theme restored
         from the bundle would land after it, which is a flash of the wrong
         colours on every single load. So this much runs in <head>, and nothing
         else does — what happens after a chip is pressed is
         src/client/theme/.

         THREE preferences ride it, and the third — the type SIZE — is the one
         whose flash would be worst: a page that painted at 16px and reflowed to
         18px would move every line under a reader who had just opened it.

         It deliberately knows no theme, font or size names: the sheet carries a
         block per palette, per typeface and per size, and the tables that
         generate them live in one place each (src/client/theme/palettes.ts,
         src/client/theme/sizes.ts, and @olai/fonts's catalog). A stored name no
         row offers is forgotten by the app once it is up, which is the first
         moment anything knows the lists. The keys are those tables'
         THEME_STORAGE_KEY / FONT_STORAGE_KEY / SIZE_STORAGE_KEY and the
         attributes are THEME_ATTRIBUTE / FONT_ATTRIBUTE / SIZE_ATTRIBUTE;
         theme/css.test.ts and theme/fonts.test.ts hold this script to them.

         `setAttribute`, not `dataset.theme`: they are the same thing today,
         and the day a pref's name has a hyphen in it they are not. -->
    <script>
      try {
        var picked = localStorage.getItem("olai.theme");
        if (picked) document.documentElement.setAttribute("data-theme", picked);
        var face = localStorage.getItem("olai.font");
        if (face) document.documentElement.setAttribute("data-font", face);
        var size = localStorage.getItem("olai.size");
        if (size) document.documentElement.setAttribute("data-size", size);
      } catch {}
    </script>
    <!-- The browser chrome around an installed app: a phone's status bar, an
         installed window's title bar. ONE of them, holding the DEFAULT theme's
         paper — the palette a page that has picked nothing reads in — because
         that is the only one this shell can know before the bundle runs. A
         page that did pick repaints this from the table (theme/state.ts). The
         value is `--color-paper` of the default palette, which cannot be read
         from here (the sheet is a build artifact and this shell is what loads
         it) and is pinned by theme/css.test.ts instead. -->
    <meta name="theme-color" content="#D7F0E8" />
    <!-- The header chip draws a person's picture, and it is a remote <img>.
         WHOSE host that is belongs to whoever deployed this olai: the IdP
         avatar a proxy hands over (`Tailscale-User-Profile-Pic`), the avatar
         template an operator configured (`https://github.com/{login}.png`,
         which itself redirects to another host), or gravatar. None of those
         is known when this file is written, and the last two are not even
         known when the server starts — so the policy names the SCHEME:
         https, plus this vault and a blob: the chat's own thumbnails
         already are. It is still a policy, not a hole: http:, data: and
         every other scheme are refused, and the src itself can only ever be
         what who.get answered off the upgrade (who/policy.test.ts). What a DOCUMENT
         may draw is a different rule in a different place and did not move
         with this one: markdown/rewrite.ts resolves a picture through
         @olai/format's pictureOf and draws NOTHING for a remote src, so no
         note can tell a third party what someone is reading whatever this
         line says (markdown/render.test.ts holds it). Sealed /media pages carry a stricter policy on the
         RESPONSE and do not inherit this. img-src alone, so the inline
         theme script below is untouched. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="img-src 'self' blob: https:"
    />
    <!-- What the browser should assume before the sheet lands: it cannot know
         yet which theme this page is in, and the themes come both ways. Once
         the sheet is in, each palette's own `color-scheme` is what wins. -->
    <meta name="color-scheme" content="light dark" />
    <!-- The install surface. The manifest is the SERVER's
         (packages/server/src/listener.ts, through kolu's manifest layer); the
         icons are files copied to the dist root by the build. `rel="icon"` is
         the tab's first paint — the install mark — because the bundle has not
         run yet; chrome.ts replaces it from the palette in force.
         `apple-touch-icon` is iOS's Add to Home Screen, which reads no
         manifest — so the install mark has to be named twice. There is no
         service worker and no offline shell: this app is live or nothing. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="olai" />
    <!-- The markdown pipeline is NOT named here, and deliberately not preloaded
         either: an outline of rows must not fetch it at all, and a preload is a
         fetch. The page finds it by asking — a dynamic `import()` the bundler
         splits into its own hashed chunk (src/client/markdown/chunk.ts). -->
    <!-- The `href` below and the `<script src>` in the body are the two
         placeholders the build rewrites to hashed /_olai/assets/* URLs; they must
         match build.ts byte for byte. -->
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <!-- The page's own two utilities. Tailwind's preflight zeroes the body
       margin; the palette and the font are ours. -->
  <body class="bg-paper font-sans text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
