<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover is what makes `env(safe-area-inset-*)` report
         anything but zero. interactive-widget=resizes-content asks an
         on-screen keyboard to shrink the viewport; iOS Safari does not
         honour it, and the layout row measures `visualViewport` there. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>olai</title>
    <meta name="description" content="outlines in flat-record JSONL" />
    <meta
      http-equiv="Content-Security-Policy"
      content="img-src 'self' blob: https:"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="bg-paper font-sans text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
