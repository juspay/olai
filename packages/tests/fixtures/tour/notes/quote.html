<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cabinet quote</title>
<style>
  body { font-family: Georgia, serif; color: #2b2a26; background: #fbf8f1; margin: 2rem; }
  h1 { font-size: 1.8rem; color: #6b3d1f; margin: 0 0 0.3rem; }
  p { margin: 0 0 1.4rem; color: #6d675c; }
  table { border-collapse: collapse; min-width: 28rem; }
  th, td { padding: 0.5rem 0.9rem; border-bottom: 1px solid #ddd3c0; text-align: left; }
  th { font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; color: #8a8173; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; }
  tr.total td { border-bottom: 0; border-top: 2px solid #6b3d1f; font-weight: bold; }
</style>
</head>
<body>
<h1>Cabinet quote</h1>
<p>From the joinery place, for the kitchen.</p>
<table>
  <tr><th>Unit</th><th>Count</th><th>Price</th></tr>
  <tr><td>Base, 600 mm</td><td class="n">4</td><td class="n">£1,840</td></tr>
  <tr><td>Upper, 600 mm</td><td class="n">3</td><td class="n">£1,170</td></tr>
  <tr><td>Corner carousel, 900 mm</td><td class="n">1</td><td class="n">£760</td></tr>
  <tr class="total"><td>Total</td><td></td><td class="n">£3,770</td></tr>
</table>
</body>
</html>
