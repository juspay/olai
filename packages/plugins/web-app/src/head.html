    <!-- iOS outranks the manifest with these two: given an `apple-touch-icon`
         link it ignores the manifest's icons, and `apple-mobile-web-app-title`
         is the name an Add to Home Screen install wears. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="olai" />
