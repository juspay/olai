    <!-- INLINE-NESS IS LOAD-BEARING, and this is the only script in the shell.
         A theme picked in this browser has to be on <html> before the FIRST
         PAINT; everything else on this page is deferred, so a theme restored
         from the bundle would land after it, which is a flash of the wrong
         colours on every single load. So this much runs in <head>, and nothing
         else does — what happens after a chip is pressed is
         src/client/theme/.

         THREE preferences ride it, and the third — the type SIZE — is the one
         whose flash would be worst: a page that painted at 16px and reflowed to
         18px would move every line under a reader who had just opened it.

         It deliberately knows no theme, font or size names: the sheet carries a
         block per palette, per typeface and per size, and the tables that
         generate them live in one place each (src/client/theme/palettes.ts,
         src/client/theme/sizes.ts, and @olai/fonts's catalog). A stored name no
         row offers is forgotten by the app once it is up, which is the first
         moment anything knows the lists. The keys are those tables'
         THEME_STORAGE_KEY / FONT_STORAGE_KEY / SIZE_STORAGE_KEY and the
         attributes are THEME_ATTRIBUTE / FONT_ATTRIBUTE / SIZE_ATTRIBUTE;
         theme/css.test.ts and theme/fonts.test.ts hold this script to them.

         `setAttribute`, not `dataset.theme`: they are the same thing today,
         and the day a pref's name has a hyphen in it they are not. -->
    <script>
      try {
        var picked = localStorage.getItem("olai.theme");
        if (picked) document.documentElement.setAttribute("data-theme", picked);
        var face = localStorage.getItem("olai.font");
        if (face) document.documentElement.setAttribute("data-font", face);
        var size = localStorage.getItem("olai.size");
        if (size) document.documentElement.setAttribute("data-size", size);
      } catch {}
    </script>
    <!-- The browser chrome around an installed app: a phone's status bar, an
         installed window's title bar. ONE of them, holding the DEFAULT theme's
         paper — the palette a page that has picked nothing reads in — because
         that is the only one this shell can know before the bundle runs. A
         page that did pick repaints this from the table (theme/state.ts). The
         value is `--color-paper` of the default palette, which cannot be read
         from here (the sheet is a build artifact and this shell is what loads
         it) and is pinned by theme/css.test.ts instead. -->
    <meta name="theme-color" content="#D7F0E8" />
    <!-- What the browser should assume before the sheet lands: it cannot know
         yet which theme this page is in, and the themes come both ways. Once
         the sheet is in, each palette's own `color-scheme` is what wins. -->
    <meta name="color-scheme" content="light dark" />
