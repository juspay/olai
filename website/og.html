<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>olai — Open Graph card</title>
<!--
  1200×630 social card. The PNG crawlers fetch is og.png; this file is
  the source. To regenerate, from this directory:

    google-chrome --headless=new --disable-gpu --hide-scrollbars \
      --force-device-scale-factor=2 --window-size=1200,630 \
      --screenshot=og.png og.html
-->
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,400;1,9..144,600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:  #D7F0E8;
    --ink:    #14352F;
    --muted:  #467269;
    --accent: #B34219;
    --display: "Fraunces", Palatino, serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px; height: 630px; overflow: hidden;
    background: var(--paper); color: var(--ink);
  }
  .card {
    width: 1200px; height: 630px;
    display: grid;
    grid-template-columns: 1.05fr 0.95fr;
    gap: 0;
    padding: 0;
    align-items: stretch;
  }
  .copy {
    padding: 72px 56px 56px 72px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .kicker {
    font-family: var(--mono); font-size: 16px; letter-spacing: 0.22em;
    text-transform: uppercase; color: var(--accent);
  }
  .wordmark {
    font-family: var(--display); font-style: italic; font-weight: 600;
    font-size: 118px; letter-spacing: -0.045em; line-height: 0.9;
    margin-top: 10px;
  }
  .tag {
    font-family: var(--display); font-style: italic; font-weight: 400;
    font-size: 34px; line-height: 1.2; margin-top: 28px;
    max-width: 12ch;
  }
  .host {
    font-family: var(--mono); font-size: 16px; color: var(--muted);
    margin-top: 40px;
  }
  .plate {
    overflow: hidden;
  }
  .plate img {
    width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%;
    display: block;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="copy">
      <div class="kicker">a git-native outliner</div>
      <div class="wordmark">olai</div>
      <div class="tag">Memory for the AI era.</div>
      <div class="host">olai.kolu.dev</div>
    </div>
    <div class="plate">
      <img src="leaf.jpg" alt="">
    </div>
  </div>
</body>
</html>
