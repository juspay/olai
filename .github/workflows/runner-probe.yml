# Spike: which GitHub-hosted / org runner labels actually schedule for
# juspay/olai, and what hardware they are. Do not merge. Close the PR
# once the run has reported sizes.
name: runner-probe

on:
  pull_request:
    paths:
      - ".github/workflows/runner-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        label:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-latest-large
          - macos-latest-xlarge
          - hyperswitch-runners
          - hyperswitch-runners-merge
          - ubuntu-latest-8-cores
          - ubuntu-latest-16-cores
          - ubuntu-latest-32-cores
          - ubuntu-latest-64-cores
          - ubuntu-latest-96-cores
          - ubuntu-24.04-8core
          - ubuntu-24.04-16core
          - ubuntu-24.04-32core
          - ubuntu-24.04-64core
          - ubuntu-24.04-96core
    runs-on: ${{ matrix.label }}
    timeout-minutes: 8
    continue-on-error: true
    steps:
      - name: Report machine
        shell: bash
        run: |
          set -euo pipefail
          ncpu=$(getconf _NPROCESSORS_ONLN)
          if [ -r /proc/meminfo ]; then
            memory_gib=$(awk '/MemTotal/{printf "%.1f", $2/1024/1024}' /proc/meminfo)
          else
            memory_gib=$(awk "BEGIN {printf \"%.1f\", $(sysctl -n hw.memsize)/1024/1024/1024}")
          fi
          line="PROBE label=${{ matrix.label }} ncpu=${ncpu} memory_gib=${memory_gib} arch=${RUNNER_ARCH:-} os=${RUNNER_OS:-} runner=${RUNNER_NAME:-}"
          echo "$line"
          {
            echo "## ${{ matrix.label }}"
            echo
            echo '```'
            echo "$line"
            uname -a
            if [ -r /proc/cpuinfo ]; then
              awk -F': ' '/model name/{print "cpu_model: "$2; exit}' /proc/cpuinfo
            else
              echo "cpu_brand: $(sysctl -n machdep.cpu.brand_string 2>/dev/null || true)"
            fi
            df -h / | cat
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
