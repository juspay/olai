# Deploys website/ to GitHub Pages (olai.kolu.dev). The site is static files,
# no build step: the artifact IS the directory.
name: pages

on:
  push:
    # `website` is here so the PR branch deploys for preview before merge;
    # harmless to keep, since the branch is deleted on merge.
    branches: [master, website]
    paths: ["website/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
