# Build every flake output on linux + darwin and push the closures to odu's
# `kolu` bucket, served at https://cache.kolu.dev: the same daemon that runs
# this repository's CI. The flake already lists this cache as a substituter, so
# a green run here warms `nix build` / `nix develop` on both platforms (odu
# lanes included). The push is `juspay/odu/.github/actions/push`: the step any
# project uses, which brings its own `odu` from the sha it is pinned to, and
# proves every path the bucket serves answers at the substituter before the
# step can go green.
name: nix-cache

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-cache-${{ github.ref }}
  cancel-in-progress: true

env:
  # THE BUCKET'S URL, for the pusher and for the flake's readers alike — the
  # same URL the flake hands every user. If it misbehaves the run is red: a
  # cache that cannot be written is a fact this job reports, not one it
  # routes around.
  PUSH_ORIGIN: https://cache.kolu.dev

jobs:
  build-and-push:
    strategy:
      fail-fast: false
      matrix:
        # xlarge is the ARM box (aarch64-darwin). macos-latest-large is Intel
        # and would warm x86_64-darwin instead.
        os: [ubuntu-latest, macos-latest-xlarge]
    runs-on: ${{ matrix.os }}
    steps:
      # pull_request's default ref is the synthetic merge commit; warm the
      # branch head (what `nix run github:juspay/olai/<branch>` builds).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # The bucket's public half: the same pair every flake advertises, so this
      # job substitutes what an earlier run pushed instead of rebuilding it.
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_conf: |
            extra-substituters = https://cache.kolu.dev
            extra-trusted-public-keys = kolu-1:eAXwD1RPt1BpFjrHfVUO8Ia0bK32WcuIeJcwFWmgj9Y=
            accept-flake-config = true

      # BUILD HERE, PUSH IN THE NEXT STEP — because the push is an action
      # (`juspay/odu/.github/actions/push`) that owns its own `odu`, its own
      # token rule and its own proof of what landed. Nothing in this step
      # reads a secret or branches on one.
      - name: Build every flake output, and name its closure roots
        id: roots
        shell: bash
        run: |
          set -euo pipefail
          system=$(nix eval --impure --raw --expr builtins.currentSystem)
          installables=()
          for kind in packages checks devShells; do
            names=$(nix eval --raw ".#$kind.$system" --apply 'attrs: builtins.concatStringsSep "\n" (builtins.attrNames attrs)')
            count=0
            while IFS= read -r name; do
              [ -n "$name" ] || continue
              installables+=(".#$kind.$system.$name")
              count=$((count + 1))
            done <<< "$names"
            if [ "$count" -eq 0 ]; then
              echo "::error::flake exposed no $kind outputs for $system"
              exit 1
            fi
          done
          echo "::group::nix build"
          paths=$(nix build -L --no-link --print-out-paths "${installables[@]}")
          printf '%s\n' "$paths"
          echo "::endgroup::"
          if [ -z "$paths" ]; then
            echo "::error::nix build produced no output paths"
            exit 1
          fi
          # Runtime closures of the outputs, plus each output's realized
          # build-time inputs (bun-pkg FODs a rebuild still needs). The
          # bucket's upstream filter drops anything already on cache.nixos.org,
          # and the pusher expands each path's own closure, so this is
          # the list of ROOTS, not of every path.
          #
          # `.drv` FILES ARE FILTERED OUT. `nix-store -qR --include-outputs` on
          # a deriver answers that deriver's whole input graph, recipes and
          # all, and a binary cache serves outputs: pushing one is refused with
          # "is a derivation — a cache serves outputs". The OUTPUTS of those
          # inputs are what a rebuild actually substitutes, and they stay.
          {
            printf '%s\n' "$paths"
            while IFS= read -r p; do
              drv=$(nix-store -q --deriver "$p")
              [ -n "$drv" ] && [ "$drv" != unknown-deriver ] || continue
              nix-store -qR --include-outputs "$drv"
            done <<< "$paths"
          } | awk 'NF && !seen[$0]++ && $0 !~ /\.drv$/' > "$RUNNER_TEMP/roots"
          # THE ACTION'S `paths:` INPUT IS ONE ENVIRONMENT VARIABLE, and Linux
          # caps a single environment string at 128 KiB (`MAX_ARG_STRLEN`). A
          # full flake's roots are ~2 500 store paths — ~210 KiB — so they
          # cannot be named one by one in it. They are named as LINKS instead:
          # one symlink per root, thirteen bytes a line, ~33 KiB. That is a
          # shape the action already takes ("`result` links"), and
          # `nix path-info` reads a link as the store path it points at, so
          # what reaches the pusher — and what it uploads — is unchanged.
          links="$GITHUB_WORKSPACE/.roots"
          mkdir -p "$links"
          {
            i=0
            while IFS= read -r root; do
              printf -v name '%04d' "$((i = i + 1))"
              ln -sfn "$root" "$links/$name"
              printf '%s\n' "./.roots/$name"
            done < "$RUNNER_TEMP/roots"
          } > "$RUNNER_TEMP/paths"
          # A POSITIVE ASSERTION: roots that reached the action as an empty
          # input would push nothing and still report success.
          [ -s "$RUNNER_TEMP/paths" ] || {
            echo "::error::the built outputs named no closure roots"
            exit 1
          }
          {
            echo "paths<<ODU_PUSH_ROOTS"
            cat "$RUNNER_TEMP/paths"
            echo "ODU_PUSH_ROOTS"
          } >> "$GITHUB_OUTPUT"

      # THE PUSH, AND ITS PROOF. `juspay/odu/.github/actions/push` is the step
      # any project uses, and it decides nothing for its caller: the `odu` it
      # pushes with is built from ITS OWN checkout, so this pinned sha is the
      # client — not a release page that can drift. It expands and uploads the
      # roots above (named as the links the previous step made), then asks the
      # bucket over plain HTTP, as a Nix client would, for every served path's
      # narinfo AND the NAR it names: a narinfo that answers proves nothing
      # about the object behind it, and a NAR truncated by a proxy's body cap
      # is caught rather than counted as landed. Any path that fails is named
      # and the step is red.
      #
      # THE TOKEN RULE IS THE ACTION'S: no token on a pull request builds and
      # pushes nothing (the PR is still owed its build); no token on a `push`
      # event fails, naming the secret; and the token is never an argument.
      #
      # THE PIN IS ODU MASTER, `b805557` — #142's merge commit, the commit
      # that ships this action. `odu cache` is a client of the bucket's own
      # HTTP API, so the pusher must speak the shape that daemon answers, and
      # no released `odu` has cache verbs: re-pin with the daemon, by SHA, and
      # NOT to this checkout's npins odu (the revision kolu's grafted @odu/*
      # sources were built against; it has no cache verbs at all).
      - uses: juspay/odu/.github/actions/push@8ee6c59bf3e2a2c94f1405e003c203c7d972091f # odu #145 (pin input)
        with:
          origin: ${{ env.PUSH_ORIGIN }}
          bucket: kolu
          token: ${{ secrets.ODU_CACHE_TOKEN }}
          paths: ${{ steps.roots.outputs.paths }}
          # Re-point the olai-master pin at this closure on a default-branch push.
          pin: olai-master
