# Build every flake output on linux + darwin and push the closures to odu's
# `kolu` bucket, served at https://cache.kolu.dev: the same daemon that runs
# this repository's CI. The flake already lists this cache as a substituter, so
# a green run here warms `nix build` / `nix develop` on both platforms (odu
# lanes included). `odu cache push` is the client.
name: nix-cache

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-cache-${{ github.ref }}
  cancel-in-progress: true

env:
  # THE CLIENT IS PINNED TO A COMMIT, and it is deliberately NOT this
  # checkout's npins pin: the pin the grafted @odu/* sources come from is the
  # revision kolu's closure was built against (nix/kolu.nix refuses a
  # mismatch), and it has no cache verbs at all. The client here moves on its
  # own schedule, and deliberately.
  #
  # This is the release that makes the step's exit code mean something: a path
  # the bucket accepts and cannot serve yet — its references are upstream-
  # signed, so the bucket fetches them itself — is reported as HELD and leaves
  # the command at 0, while a real refusal or a byte-level disagreement is a
  # failure. It also chunks a NAR, so a multi-hundred-megabyte store path is
  # not one request's fate.
  ODU_REV: 150ad5e97503d53f0ad6ea4fdc7edd385ede212b
  # PUSH ORIGIN: the pod's own address, not the bucket's advertised name.
  # They are the same daemon and the same bucket, and READERS are given
  # `cache.kolu.dev` (the flake's nixConfig). This job cannot use it: pushing
  # through Cloudflare's proxy answers 502 Bad Gateway once this job's upload
  # load arrives — the run that tried it failed 292 paths on "<!DOCTYPE html>"
  # bodies and then every `missing` query, on both runners — so writers use the
  # name that answers. When that route is exercised and healthy, this line
  # becomes `https://cache.kolu.dev`; nothing else in this workflow or the
  # flake moves.
  PUSH_ORIGIN: https://odu-k3s.rooster-blues.ts.net

jobs:
  build-and-push:
    strategy:
      fail-fast: false
      matrix:
        # xlarge is the ARM box (aarch64-darwin). macos-latest-large is Intel
        # and would warm x86_64-darwin instead.
        os: [ubuntu-latest, macos-latest-xlarge]
    runs-on: ${{ matrix.os }}
    steps:
      # pull_request's default ref is the synthetic merge commit; warm the
      # branch head (what `nix run github:juspay/olai/<branch>` builds).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # The bucket's public half: the same pair every flake advertises, so this
      # job substitutes what an earlier run pushed instead of rebuilding it.
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_conf: |
            extra-substituters = https://cache.kolu.dev
            extra-trusted-public-keys = kolu-1:eAXwD1RPt1BpFjrHfVUO8Ia0bK32WcuIeJcwFWmgj9Y=
            accept-flake-config = true

      # ONE step, so the token is never consulted in an `if` and the paths the
      # pusher walks exist where it runs. A pull request from a fork has no
      # secret and pushes nothing — it still BUILDS, which is the check this
      # workflow owes a PR. A push with no token FAILS: going green having
      # warmed nothing is the state a cache job exists to make impossible.
      #
      # ODU PUSHES. `odu cache push` expands the closure of every path it is
      # given, asks the bucket what it is missing in ONE query — dropping what
      # an upstream key signed, so nixpkgs never costs an upload — and uploads
      # in dependency order. A path the bucket accepted and cannot serve yet,
      # because a reference it will not accept from us has not been fetched by
      # the bucket, is reported as HELD and is not this step's failure; a path
      # that was refused, or whose bytes disagreed with its narinfo, is.
      - name: Build and push every flake output
        shell: bash
        env:
          ODU_CACHE_TOKEN: ${{ secrets.ODU_CACHE_TOKEN }}
        run: |
          set -euo pipefail
          system=$(nix eval --impure --raw --expr builtins.currentSystem)
          installables=()
          for kind in packages checks devShells; do
            names=$(nix eval --raw ".#$kind.$system" --apply 'attrs: builtins.concatStringsSep "\n" (builtins.attrNames attrs)')
            count=0
            while IFS= read -r name; do
              [ -n "$name" ] || continue
              installables+=(".#$kind.$system.$name")
              count=$((count + 1))
            done <<< "$names"
            if [ "$count" -eq 0 ]; then
              echo "::error::flake exposed no $kind outputs for $system"
              exit 1
            fi
          done
          echo "::group::nix build"
          paths=$(nix build -L --no-link --print-out-paths "${installables[@]}")
          printf '%s\n' "$paths"
          echo "::endgroup::"
          if [ -z "$paths" ]; then
            echo "::error::nix build produced no output paths"
            exit 1
          fi
          if [ -z "$ODU_CACHE_TOKEN" ]; then
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo "::error::ODU_CACHE_TOKEN is not set on $GITHUB_REPOSITORY — this push would publish no closure. It is a write token for the kolu bucket (a bucket page mints one)."
              exit 1
            fi
            echo "no ODU_CACHE_TOKEN (a pull request from a fork) — built, pushed nothing"
            exit 0
          fi
          # Runtime closures of the outputs, plus each output's realized
          # build-time inputs (bun-pkg FODs a rebuild still needs). The
          # bucket's upstream filter drops anything already on cache.nixos.org,
          # and `odu cache push` expands each path's own closure, so this is
          # the list of ROOTS, not of every path.
          {
            printf '%s\n' "$paths"
            while IFS= read -r p; do
              drv=$(nix-store -q --deriver "$p")
              [ -n "$drv" ] && [ "$drv" != unknown-deriver ] || continue
              nix-store -qR --include-outputs "$drv"
            done <<< "$paths"
          } | awk 'NF && !seen[$0]++' > "$RUNNER_TEMP/roots"
          # BATCHED, because a full flake's roots are several thousand store
          # paths and one argv would pass macOS's 1 MiB ARG_MAX. Batching is
          # safe rather than merely convenient: the pusher expands each batch's
          # OWN closure, so a reference always travels in the batch of whatever
          # refers to it. The list arrives on stdin, not through `-a` — that is
          # a GNU extension, and the darwin leg runs BSD xargs.
          xargs -n 400 \
            nix run --accept-flake-config "github:juspay/odu/$ODU_REV" -- \
            cache push kolu --origin "$PUSH_ORIGIN" < "$RUNNER_TEMP/roots"
